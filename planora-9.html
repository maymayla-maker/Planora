<body>
<div id="app"><div style="max-width:420px;margin:15vh auto;padding:24px;font-family:system-ui,sans-serif;text-align:center;color:#161e2e"><h1 style="font-size:24px">Planora</h1><p>Halaman ini perlu dibuka di browser seperti Chrome atau Safari.</p><p style="font-size:14px;color:#5a6477">Kalau file ini dibuka dari WA atau Google Drive, unduh dulu, lalu pilih <b>Buka dengan Chrome</b>.</p></div></div>
<noscript><p style="text-align:center;font-family:system-ui,sans-serif">Aktifkan JavaScript atau buka file ini di Chrome/Safari.</p></noscript>
<script>
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const KRIT=['Sisa hari (cost)','Bobot nilai','Kesulitan','Durasi','SKS'];
const STORE='planora-proto-v1';

const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseISO=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const fmtD=d=>HS[d.getDay()]+', '+d.getDate()+' '+BL[d.getMonth()];
const toU=s=>{const p=s.split(':').map(Number);return p[0]*2+Math.round(p[1]/30);};
const fmtU=u=>String(Math.floor(u/2)).padStart(2,'0')+'.'+(u%2?'30':'00');
const jam=u=>{const h=u/2;return (Number.isInteger(h)?h:h.toFixed(1).replace('.',','))+' jam';};
const dec=(x,n=2)=>x.toFixed(n).replace('.',',');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid=100;

const defSettings=()=>({jamMaks:4, mulai:'08:00', selesai:'21:00', w:[0.40,0.25,0.15,0.10,0.10]});
const emptyData=()=>({settings:defSettings(), fixed:[], tasks:[]});
function sample(){
  const t=today0(), dl=n=>iso(addDays(t,n));
  return {
    settings:defSettings(),
    fixed:[
      {id:1,hari:1,mulai:'08:00',selesai:'10:00',nama:'Kuliah Kalkulus'},
      {id:2,hari:1,mulai:'13:00',selesai:'15:00',nama:'Kuliah Statistika'},
      {id:3,hari:2,mulai:'10:00',selesai:'12:00',nama:'Kuliah Aljabar Linear'},
      {id:4,hari:2,mulai:'16:00',selesai:'18:00',nama:'Rapat organisasi'},
      {id:5,hari:3,mulai:'08:00',selesai:'11:00',nama:'Praktikum Analisis Numerik'},
      {id:6,hari:4,mulai:'13:00',selesai:'16:00',nama:'Kuliah Proses Stokastik'},
      {id:7,hari:5,mulai:'08:00',selesai:'10:00',nama:'Kuliah Analisis Numerik'},
      {id:8,hari:5,mulai:'16:00',selesai:'17:00',nama:'Olahraga'},
      {id:9,hari:6,mulai:'09:00',selesai:'13:00',nama:'Kerja part-time'}
    ],
    tasks:[
      {id:11,nama:'Laporan praktikum',mk:'Analisis Numerik',sks:3,deadline:dl(1),bobot:30,kes:4,durasi:8,done:false},
      {id:12,nama:'Tugas Aljabar Linear',mk:'Aljabar Linear',sks:3,deadline:dl(2),bobot:20,kes:3,durasi:6,done:false},
      {id:13,nama:'Makalah Proses Stokastik',mk:'Proses Stokastik',sks:3,deadline:dl(5),bobot:40,kes:5,durasi:10,done:false},
      {id:14,nama:'Persiapan kuis Statistika',mk:'Statistika',sks:2,deadline:dl(3),bobot:10,kes:2,durasi:3,done:false},
      {id:15,nama:'Latihan soal Kalkulus',mk:'Kalkulus',sks:3,deadline:dl(6),bobot:15,kes:3,durasi:3,done:false},
      {id:16,nama:'Baca jurnal untuk seminar',mk:'Seminar',sks:2,deadline:dl(9),bobot:5,kes:2,durasi:2,done:false},
      {id:17,nama:'Ringkasan bab 3',mk:'Statistika',sks:2,deadline:dl(-2),bobot:5,kes:2,durasi:2,done:true,doneAt:dl(-3)}
    ]
  };
}
/* ---------- akun: tiap user punya data sendiri ---------- */
const UKEY='planora-users-v2', SKEY='planora-session-v2';
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(16);};
let USERS=load(UKEY,{});
let SESSION=load(SKEY,null);
if(SESSION&&!USERS[SESSION]) SESSION=null;
let S=SESSION?USERS[SESSION].data:null;
let loginMode='masuk', loginMsg='';
let editTask=null, editFix=null, askDel=false;
const newId=()=>Date.now()*100+Math.floor(Math.random()*100);
const save=()=>{if(SESSION){USERS[SESSION].data=S;put(UKEY,USERS);}};

/* ---------- inti perhitungan ---------- */
const sisa=t=>Math.round((parseISO(t.deadline)-today0())/864e5);
function weights(){const w=S.settings.w.map(Number);const tot=w.reduce((a,b)=>a+b,0)||1;return {w:w.map(x=>x/tot),tot};}
function scored(){
  const act=S.tasks.filter(t=>!t.done);
  if(!act.length) return [];
  const {w}=weights();
  const rows=act.map(t=>{const s=sisa(t);return {t,s,x:[Math.max(s,0)+1,t.bobot,t.kes,t.durasi,t.sks]};});
  const mn=Math.min(...rows.map(r=>r.x[0]));
  const mx=[1,2,3,4].map(j=>Math.max(...rows.map(r=>r.x[j]))||1);
  rows.forEach(r=>{
    r.r=[mn/r.x[0],r.x[1]/mx[0],r.x[2]/mx[1],r.x[3]/mx[2],r.x[4]/mx[3]];
    r.V=r.r.reduce((a,v,j)=>a+v*w[j],0);
    r.label=r.V>=0.70?'Tinggi':r.V>=0.50?'Sedang':'Rendah';
    r.mendesak=r.s<=3; r.penting=r.t.bobot>=20||r.t.kes>=4;
    r.q=r.penting&&r.mendesak?1:r.penting?2:r.mendesak?3:4;
    r.kb=r.q===1?0:r.s<=7?1:2;
  });
  rows.sort((a,b)=>b.V-a.V);
  return rows;
}
const colorOf=id=>{const ids=S.tasks.map(t=>t.id);return COLORS[ids.indexOf(id)%COLORS.length];};
const pillCls=l=>l==='Tinggi'?'t':l==='Sedang'?'s':'r';
const lvlColor=l=>l==='Tinggi'?'var(--high)':l==='Sedang'?'var(--mid)':'var(--low)';
const lvlName=l=>l==='Tinggi'?'Penting':l==='Sedang'?'Sedang':'Santai';

function freeUnits(d){
  const date=addDays(today0(),d), wd=date.getDay();
  let a=toU(S.settings.mulai), b=toU(S.settings.selesai);
  if(d===0){const n=new Date();const nu=Math.ceil((n.getHours()*60+n.getMinutes())/30);a=Math.max(a,nu);}
  const busy=S.fixed.filter(f=>f.hari===wd).map(f=>[toU(f.mulai),toU(f.selesai)]);
  const out=[];
  for(let u=a;u<b;u++) if(!busy.some(([x,y])=>u>=x&&u<y)) out.push(u);
  return out;
}
const capDay=d=>Math.min(S.settings.jamMaks*2,freeUnits(d).length);

function feasibility(rows){
  const sorted=[...rows].filter(r=>r.s>=0).sort((a,b)=>a.s-b.s);
  const warn=[]; let need=0;
  sorted.forEach(r=>{
    need+=r.t.durasi*2;
    let cap=0; for(let d=0;d<=r.s;d++) cap+=capDay(d);
    if(need>cap) warn.push({r,need,cap});
  });
  return warn;
}

function plan(rows){
  const rem={}; rows.forEach(r=>rem[r.t.id]=Math.round(r.t.durasi*2));
  const H=Math.min(21,Math.max(7,...rows.map(r=>r.s+1)));
  const caps=[];for(let d=0;d<H;d++)caps.push(capDay(d));
  const days=[];
  for(let d=0;d<H;d++){
    const free=freeUnits(d), cap=caps[d]; let p=0, used=0; const per={}; const blocks=[];
    while(used<cap){
      const el=rows.filter(r=>rem[r.t.id]>0&&r.s>=d);
      if(!el.length)break;
      const edf=[...el].sort((a,b)=>a.s-b.s); let cum=0; const crit=new Set();
      edf.forEach(r=>{cum+=rem[r.t.id];let c=cap-used;for(let k=d+1;k<=r.s&&k<H;k++)c+=caps[k];if(cum>=c)crit.add(r.t.id);});
      let pick=crit.size?edf[0]:null, lim;
      if(pick){lim=cap-used;}
      else{pick=el.find(r=>(per[r.t.id]||0)<4); if(!pick)break; lim=4-(per[pick.t.id]||0);}
      const k=Math.min(rem[pick.t.id],lim,cap-used,free.length-p);
      if(k<=0)break;
      const us=free.slice(p,p+k); p+=k; used+=k; rem[pick.t.id]-=k; per[pick.t.id]=(per[pick.t.id]||0)+k;
      let s=us[0],prev=us[0];
      for(let i=1;i<=us.length;i++){ if(i===us.length||us[i]!==prev+1){blocks.push({id:pick.t.id,a:s,b:prev+1});if(i<us.length)s=us[i];} if(i<us.length)prev=us[i]; }
    }
    blocks.sort((x,y)=>x.a-y.a);
    days.push({d,blocks,used});
  }
  const missed=rows.filter(r=>rem[r.t.id]>0).map(r=>({r,left:rem[r.t.id]}));
  return {days,missed};
}

function compute(){
  const rows=scored();
  return {rows,warn:feasibility(rows),P:plan(rows)};
}

/* ---------- tampilan ---------- */
const VIEWS=[['beranda','Beranda'],['jadwal','Jadwal'],['tugas','Tugas'],['prioritas','Prioritas'],['rencana','Rencana Harian'],['progres','Progres'],['pengaturan','Pengaturan']];
const taskById=id=>S.tasks.find(t=>t.id===id);

function timeline(P,nDays){
  const a=toU(S.settings.mulai), b=toU(S.settings.selesai), span=b-a, pct=u=>((u-a)/span*100);
  let h='<div class="tl">';
  for(let d=0;d<nDays&&d<P.days.length;d++){
    const date=addDays(today0(),d), wd=date.getDay();
    h+=`<div class="tl-row"><div class="tl-day">${d===0?'Hari ini':d===1?'Besok':HARI[wd]}<small>${fmtD(date)}</small></div><div class="tl-track">`;
    if(d===0){const n=new Date();const nu=Math.min(b,Math.max(a,Math.ceil((n.getHours()*60+n.getMinutes())/30)));if(nu>a)h+=`<div class="blk past" style="left:0;width:${pct(nu)}%" title="Sudah lewat"></div>`;}
    S.fixed.filter(f=>f.hari===wd).forEach(f=>{const x=Math.max(a,toU(f.mulai)),y=Math.min(b,toU(f.selesai));if(y>x)h+=`<div class="blk fx" style="left:${pct(x)}%;width:${pct(y)-pct(x)}%" title="${esc(f.nama)} ${fmtU(x)}–${fmtU(y)}">${esc(f.nama)}</div>`;});
    P.days[d].blocks.forEach(k=>{const t=taskById(k.id);h+=`<div class="blk tk" style="left:${pct(k.a)}%;width:${pct(k.b)-pct(k.a)}%;background:${colorOf(k.id)}" title="${esc(t.nama)} ${fmtU(k.a)}–${fmtU(k.b)}">${esc(t.nama)}</div>`;});
    h+='</div></div>';
  }
  h+='</div><div class="tl-axis">';
  for(let u=Math.ceil(a/4)*4;u<=b;u+=4)h+=`<span style="left:${pct(u)}%">${fmtU(u)}</span>`;
  return h+'</div>';
}

function warnBox(C){
  const items=[];
  S.tasks.filter(t=>!t.done&&sisa(t)<0).forEach(t=>items.push(`<div><b>${esc(t.nama)}</b> sudah lewat tenggat ${-sisa(t)} hari. Tandai selesai atau ubah deadline-nya.</div>`));
  if(C.warn.length){const w=C.warn[0];items.push(`<div><b>Beban berlebih sampai ${fmtD(parseISO(w.r.t.deadline))}:</b> butuh ${jam(w.need)} untuk tugas bertenggat sampai hari itu, kapasitasmu ${jam(w.cap)}.${C.warn.length>1?` ${C.warn.length-1} tenggat berikutnya ikut terdampak.`:''} Saran: tambah jam belajar per hari, cicil lebih awal, atau minta perpanjangan.</div>`);}
  C.P.missed.forEach(m=>items.push(`<div><b>${esc(m.r.t.nama)}</b> masih kurang ${jam(m.left)} saat tenggat.</div>`));
  if(!items.length) return `<div class="alert ok"><b>Semua tugas masih sempat dikerjakan sebelum tenggat.</b><div class="small">Kapasitas belajar ${S.settings.jamMaks} jam per hari sudah cukup.</div></div>`;
  return `<div class="alert bad"><b>Peringatan (${items.length})</b>${items.join('')}</div>`;
}

    <p class="muted" style="margin:0 0 14px">Akunmu masih kosong. Isi dua hal ini, nanti Planora menyusun prioritas dan jadwal belajarmu.</p>
    <div class="stack">
      <div class="now"><span class="big num">1</span><div><b>Isi jadwal tetap</b><div class="small muted">Kuliah, praktikum, organisasi, kerja</div></div><a class="btn" href="#jadwal" style="margin-left:auto;text-decoration:none">Buka Jadwal</a></div>
      <div class="now"><span class="big num">2</span><div><b>Tambah tugas</b><div class="small muted">Deadline, bobot nilai, kesulitan, durasi</div></div><a class="btn" href="#tugas" style="margin-left:auto;text-decoration:none">Buka Tugas</a></div>
    </div>

    nowCard=`<div class="now"><span class="dot" style="background:${colorOf(k.id)};width:14px;height:40px;border-radius:4px;margin:0"></span><div><div class="small muted">${first.d===0?'Hari ini':fmtD(addDays(today0(),first.d))}, ${fmtU(k.a)}–${fmtU(k.b)}</div><div class="big">${esc(t.nama)}</div><div class="small muted">${esc(t.mk)} · tenggat ${r.s===0?'hari ini':r.s+' hari lagi'} · skor ${Math.round(r.V*100)}</div></div><span class="pill ${pillCls(r.label)}" style="margin-left:auto">${lvlName(r.label)}</span></div>`;}
  return `
  <div class="tiles">
    <div class="tile"><div class="k">Tugas aktif</div><div class="v num">${rows.length}</div><div class="s">${S.tasks.filter(t=>t.done).length} sudah selesai</div></div>
    <div class="tile ${near!==null&&near<=1?'bad':''}"><div class="k">Tenggat terdekat</div><div class="v num">${near===null?'–':near===0?'Hari ini':near+' hari'}</div><div class="s">${near===null?'':esc(rows.find(r=>r.s===near).t.nama)}</div></div>
    <div class="tile"><div class="k">Jam belajar hari ini</div><div class="v num">${jam(todayU)}</div><div class="s">dari maks ${S.settings.jamMaks} jam</div></div>
    <div class="tile ${need7>cap7?'bad':''}"><div class="k">Beban 7 hari</div><div class="v num">${jam(need7)}</div><div class="s">kapasitas ${jam(cap7)}</div></div>
  </div>
  ${warnBox(C)}
  <div class="card"><h2>Kerjakan sekarang</h2>${nowCard}</div>
  <div class="grid2">
    <div class="card"><h2>3 prioritas teratas <a class="sub" href="#prioritas">Lihat semua</a></h2>${rankList(rows.slice(0,3))}</div>
    <div class="card"><h2>Rencana hari ini dan besok <a class="sub" href="#rencana">7 hari</a></h2>${timeline(P,2)}</div>
  </div>`;

function rankList(rows){
  if(!rows.length) return '<div class="muted">Tidak ada tugas aktif.</div>';
  return rows.map((r,i)=>`<div class="rank"><div class="no num">${i+1}</div><div><div class="nm"><span class="dot" style="background:${colorOf(r.t.id)}"></span>${esc(r.t.nama)}</div><div class="small muted">${esc(r.t.mk)} · tenggat ${r.s<0?'lewat':r.s===0?'hari ini':r.s+' hari'} · bobot ${r.t.bobot}% · kesulitan ${r.t.kes} · ${r.t.durasi} jam</div><div class="bar"><i style="width:${Math.round(r.V*100)}%;background:${lvlColor(r.label)}"></i></div></div><div style="text-align:right"><div class="num" style="font-weight:800;font-size:18px">${Math.round(r.V*100)}</div><span class="pill ${pillCls(r.label)}">${lvlName(r.label)}</span></div></div>`).join('');
}

function vPrioritas(C){
  const {rows}=C; const {w,tot}=weights();
  const matrix=[[1,'Kerjakan dulu','Penting dan mendesak'],[2,'Jadwalkan','Penting, tidak mendesak'],[3,'Selesaikan cepat','Mendesak, kurang penting'],[4,'Tunda','Tidak keduanya']]
    .map(([q,n,hint])=>`<div class="q q${q}"><h3>${n}</h3><div class="hint">${hint}</div>${rows.filter(r=>r.q===q).map(r=>`<span class="chip" style="border-color:${lvlColor(r.label)}">${esc(r.t.nama)}<span class="pill ${pillCls(r.label)}">${lvlName(r.label)}</span></span>`).join('')||'<span class="small muted">Kosong</span>'}</div>`).join('');
  const kan=['Kerjakan sekarang','Minggu ini','Nanti'].map((n,i)=>{const it=rows.filter(r=>r.kb===i);return `<div class="col k${i}"><h3>${n} <span class="muted">(${it.length})</span></h3>${it.map(r=>`<div class="kc" style="border-color:${lvlColor(r.label)}"><b>${esc(r.t.nama)}</b><span class="muted">${r.t.durasi} jam · ${r.s<0?'lewat':r.s+' hari lagi'} · skor ${Math.round(r.V*100)}</span></div>`).join('')||'<div class="small muted" style="margin-top:8px">Kosong</div>'}</div>`;}).join('');
  const calc=rows.map((r,i)=>`<tr><td class="num">${i+1}</td><td>${esc(r.t.nama)}</td>${r.x.map((x,j)=>`<td class="r num">${j===1?x+'%':x}<br><span class="muted small">${dec(r.r[j],3)}</span></td>`).join('')}<td class="r num"><b>${dec(r.V,3)}</b></td><td><span class="pill ${pillCls(r.label)}">${lvlName(r.label)}</span></td></tr>`).join('');
  return `
  <div class="card"><h2>Peringkat prioritas <span class="sub">skor SAW × 100</span></h2>${rankList(rows)}</div>
  <div class="grid2">
    <div class="card"><h2>Matriks Eisenhower</h2><div class="matrix">${matrix}</div><p class="small muted" style="margin:10px 0 0">Mendesak = sisa ≤ 3 hari. Penting = bobot nilai ≥ 20% atau kesulitan ≥ 4.</p></div>
    <div class="card"><h2>Papan kanban</h2><div class="kanban">${kan}</div><p class="small muted" style="margin:10px 0 0">Kerjakan sekarang = kuadran Kerjakan dulu. Minggu ini = sisa ≤ 7 hari. Nanti = sisanya.</p></div>
  </div>
  <div class="card"><h2>Rincian perhitungan SAW</h2>
    <div class="formula">Normalisasi: benefit r = x / max(x), cost r = min(x) / x. Skor V = Σ w·r. Bobot: ${KRIT.map((k,j)=>k+' '+dec(w[j]))
      .join(' · ')}${Math.abs(tot-1)>0.001?' (total '+dec(tot)+', dinormalisasi otomatis)':''}. Sisa hari dihitung sebagai D = sisa + 1.</div>
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Tugas</th><th class="r">D (hari)</th><th class="r">Bobot</th><th class="r">Kesulitan</th><th class="r">Durasi</th><th class="r">SKS</th><th class="r">V</th><th>Label</th></tr></thead><tbody>${calc}</tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">Angka kecil di bawah tiap nilai = hasil normalisasi r.</p>
  </div>`;
}

function vRencana(C){
  const {P}=C;
  const legend=[...new Set(P.days.slice(0,7).flatMap(d=>d.blocks.map(b=>b.id)))].map(id=>`<span><span class="dot" style="background:${colorOf(id)}"></span>${esc(taskById(id).nama)}</span>`).join('')+'<span><span class="dot" style="background:var(--fixed)"></span>Jadwal tetap</span>';
  const a=toU(S.settings.mulai), b=toU(S.settings.selesai);
  const ses=[['Pagi',a,Math.max(a,24)],['Siang',Math.max(a,24),Math.min(b,32)],['Sore–malam',Math.min(b,32),b]];
  let heat='<div class="heat"><div></div>';
  for(let d=0;d<7;d++){const dt=addDays(today0(),d);heat+=`<div class="h">${HS[dt.getDay()]}<br><span style="font-weight:500">${dt.getDate()}</span></div>`;}
  ses.forEach(([n,x,y])=>{heat+=`<div class="rl">${n}</div>`;for(let d=0;d<7;d++){const wd=addDays(today0(),d).getDay();let busy=0;for(let u=x;u<y;u++){if(S.fixed.some(f=>f.hari===wd&&u>=toU(f.mulai)&&u<toU(f.selesai))||P.days[d].blocks.some(k=>u>=k.a&&u<k.b))busy++;}const pc=y>x?Math.round(busy/(y-x)*100):0;heat+=`<div class="c num" style="background:color-mix(in srgb, var(--accent) ${Math.round(pc*0.85)}%, var(--bg));color:${pc>55?'#fff':'var(--ink)'}">${pc}%</div>`;}});
  heat+='</div>';
  return `
  ${warnBox(C)}
  <div class="card"><h2>Rencana 7 hari <span class="sub">jam belajar maks ${S.settings.jamMaks} jam/hari</span></h2>${timeline(P,7)}<div class="legend">${legend}</div></div>
  <div class="grid2">
    <div class="card"><h2>Heatmap kepadatan</h2>${heat}<p class="small muted" style="margin:10px 0 0">Persentase waktu terisi (jadwal tetap + belajar) per sesi.</p></div>
    <div class="card"><h2>Export ke Google Calendar</h2><p class="small muted" style="margin:0 0 8px">Salin isi di bawah, simpan sebagai <b>planora.ics</b>, lalu impor di Google Calendar.</p><textarea id="ics" readonly>${esc(ics(P))}</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:8px"><button class="btn" id="copyIcs">Salin .ics</button><span id="icsMsg" class="okmsg"></span></div></div>
  </div>`;
}
function ics(P){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Planora//ID'];
  const st=(d,u)=>{const dt=addDays(today0(),d);return iso(dt).replace(/-/g,'')+'T'+String(Math.floor(u/2)).padStart(2,'0')+(u%2?'30':'00')+'00';};
  P.days.forEach(day=>day.blocks.forEach((k,i)=>{L.push('BEGIN:VEVENT','UID:planora-'+day.d+'-'+i+'-'+k.id,'DTSTART:'+st(day.d,k.a),'DTEND:'+st(day.d,k.b),'SUMMARY:Belajar: '+taskById(k.id).nama,'END:VEVENT');}));
  L.push('END:VCALENDAR'); return L.join('\n');
}

function editBar(kind){
  if(askDel) return `<div class="alert bad" style="grid-column:1/-1"><b>Yakin hapus ${kind} ini?</b><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px"><button type="button" class="btn" id="delYes" style="background:var(--high);color:#fff">Ya, hapus</button><button type="button" class="btn ghost" id="delNo">Tidak jadi</button></div></div>`;
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;grid-column:1/-1"><button class="btn" type="submit">Simpan perubahan</button><button type="button" class="btn ghost" id="cancelEdit">Batal</button><button type="button" class="btn link" id="askDel" style="margin-left:auto;color:var(--high)">Hapus ${kind}</button></div>`;
}

      <label for="fxA">Mulai<input id="fxA" type="time" value="${ef?ef.mulai:'13:00'}" step="1800" required></label>
      <label for="fxB">Selesai<input id="fxB" type="time" value="${ef?ef.selesai:'15:00'}" step="1800" required></label>

  </div>

}

function vTugas(C){
  const et=editTask?taskById(editTask):null;

    <form class="f" id="fTask">
      <label for="tN" style="grid-column:1/-1">Nama tugas<input id="tN" required placeholder="mis. Laporan praktikum modul 4" value="${et?esc(et.nama):''}"></label>
      <label for="tM">Mata kuliah<input id="tM" required placeholder="mis. Analisis Numerik" value="${et?esc(et.mk):''}"></label>
      <label for="tS">SKS<input id="tS" type="number" min="1" max="6" value="${et?et.sks:3}" required></label>

  <div class="card"><h2>Daftar tugas</h2><div class="tbl-wrap"><table><thead><tr><th>Selesai</th><th>Tugas</th><th>Deadline</th><th class="r">Bobot</th><th class="r">Kesulitan</th><th class="r">Durasi</th><th>Skor</th><th></th></tr></thead><tbody>${list}</tbody></table></div></div>`;

function vProgres(C){
  const by={}; S.tasks.forEach(t=>{(by[t.mk]=by[t.mk]||{n:0,d:0,j:0,jd:0,tasks:[]});const g=by[t.mk];g.n++;g.j+=t.durasi;if(t.done){g.d++;g.jd+=t.durasi;}});
  const mk=Object.entries(by).sort((a,b)=>b[1].j-a[1].j).map(([n,g])=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(n)}</b><span class="num small muted">${g.d}/${g.n} tugas · ${g.jd}/${g.j} jam</span></div><div class="bar"><i style="width:${Math.round(g.jd/g.j*100)}%"></i></div></div>`).join('');
  const done=S.tasks.filter(t=>t.done), ontime=done.filter(t=>!t.doneAt||t.doneAt<=t.deadline).length, late=done.length-ontime;
  const total=S.tasks.length, pct=total?Math.round(done.length/total*100):0;
  let wk=0; C.P.days.slice(0,7).forEach(d=>wk+=d.used);
  const rep=`LAPORAN MINGGUAN PLANORA\nPeriode: ${fmtD(today0())} – ${fmtD(addDays(today0(),6))}\n\nTugas selesai: ${done.length} dari ${total} (${pct}%)\nTepat waktu: ${ontime} · Terlambat: ${late}\nRencana jam belajar 7 hari ke depan: ${jam(wk)}\n\nPrioritas teratas:\n${C.rows.slice(0,3).map((r,i)=>`${i+1}. ${r.t.nama} (skor ${Math.round(r.V*100)}, ${r.label}, tenggat ${r.s} hari)`).join('\n')}\n\nPeringatan: ${C.warn.length?C.warn.map(w=>`butuh ${jam(w.need)} sampai ${fmtD(parseISO(w.r.t.deadline))}, kapasitas ${jam(w.cap)}`).join('; '):'tidak ada'}`;
  return `
  <div class="tiles">
    <div class="tile"><div class="k">Tugas selesai</div><div class="v num">${pct}%</div><div class="s">${done.length} dari ${total} tugas</div></div>
    <div class="tile"><div class="k">Tepat waktu</div><div class="v num">${ontime}</div><div class="s">terlambat ${late}</div></div>
    <div class="tile"><div class="k">Rencana belajar 7 hari</div><div class="v num">${jam(wk)}</div><div class="s">hasil optimasi jadwal</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Progres per mata kuliah</h2>${mk}</div>
    <div class="card"><h2>Laporan mingguan</h2><textarea id="rep" readonly>${esc(rep)}</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:8px"><button class="btn" id="copyRep">Salin laporan</button><span id="repMsg" class="okmsg"></span></div></div>
  </div>`;
}

function vPengaturan(){
  const {tot}=weights();
  return `
  <div class="card"><h2>Kapasitas belajar</h2>
    <form class="f" id="fSet">
      <label for="sJ">Jam belajar maks per hari<input id="sJ" type="number" min="1" max="12" step="0.5" value="${S.settings.jamMaks}"></label>
      <label for="sA">Mulai belajar<input id="sA" type="time" step="1800" value="${S.settings.mulai}"></label>
      <label for="sB">Selesai belajar<input id="sB" type="time" step="1800" value="${S.settings.selesai}"></label>
      ${S.settings.w.map((x,j)=>`<label for="w${j}">Bobot ${KRIT[j]}<input id="w${j}" type="number" min="0" max="1" step="0.05" value="${x}"></label>`).join('')}
      <button class="btn" type="submit">Simpan pengaturan</button>
    </form>
    <div class="${Math.abs(tot-1)>0.001?'err':'okmsg'}" style="margin-top:8px">Total bobot: ${dec(tot)}${Math.abs(tot-1)>0.001?'. Sebaiknya totalnya 1; skor sementara dinormalisasi otomatis.':''}</div>

}

function vLogin(){
  const daftar=loginMode==='daftar';
  return `<div class="login"><div class="card">
    <div class="brand"><span class="brand-mark">${LOGO}</span>Planora</div>
    <h1>${daftar?'Buat akun':'Masuk'}</h1><p class="muted small" style="margin:0 0 16px">${daftar?'Setiap akun punya jadwal dan tugasnya sendiri.':'Atur jadwal dan prioritas tugas kuliahmu.'}</p>
    <form id="fLogin" style="display:grid;gap:12px">
      ${daftar?'<label for="lN">Nama<input id="lN" required placeholder="Nama lengkap"></label>':''}
      <label for="lE">Email<input id="lE" type="email" required placeholder="namaanda@planora.id"></label>
      <label for="lP">Password<input id="lP" type="password" required minlength="4" placeholder="minimal 4 karakter"></label>
      <div class="err" id="lErr">${esc(loginMsg)}</div>
      <button class="btn" type="submit">${daftar?'Daftar dan masuk':'Masuk'}</button>
    </form>
    <p class="small" style="margin:14px 0 0">${daftar?'Sudah punya akun? <button class="btn link" id="toMasuk">Masuk</button>':'Belum punya akun? <button class="btn link" id="toDaftar">Daftar</button>'}</p>
    <p class="small muted" style="margin:10px 0 0">Prototipe: akun disimpan di browser ini. Di aplikasi asli, akun dan data disimpan di database server.</p>
  </div></div>`;
}

function render(){
  const app=document.getElementById('app');
  if(!SESSION){app.innerHTML=vLogin();bind();return;}
  let v=(location.hash||'#beranda').slice(1); if(!VIEWS.some(x=>x[0]===v)) v='beranda';
  const C=compute();
  const body={beranda:vBeranda,jadwal:vJadwal,tugas:vTugas,prioritas:vPrioritas,rencana:vRencana,progres:vProgres,pengaturan:vPengaturan}[v](C);
  app.innerHTML=`<header class="top"><div class="wrap"><div class="topbar"><div class="brand"><span class="brand-mark">${LOGO}</span>Planora</div><div class="top-meta"><span>${HARI[today0().getDay()]}, ${today0().getDate()} ${BL[today0().getMonth()]} ${today0().getFullYear()}</span><span>· ${esc(USERS[SESSION].nama)}</span><button class="btn ghost" id="logout" style="padding:5px 10px">Logout</button></div></div>
  <nav class="tabs" aria-label="Menu">${VIEWS.map(([k,n])=>`<a href="#${k}" ${k===v?'aria-current="page"':''}>${n}</a>`).join('')}</nav></div></header>
  <main class="wrap">${body}</main>`;
  bind();
}
function copy(id,msg){const el=document.getElementById(id);try{navigator.clipboard.writeText(el.value).then(()=>{document.getElementById(msg).textContent='Tersalin.';},()=>{el.select();document.getElementById(msg).textContent='Pilih teks lalu salin manual.';});}catch(e){el.select();}}
function bind(){
  const $=id=>document.getElementById(id);
  if($('fLogin')) $('fLogin').onsubmit=e=>{e.preventDefault();
    const email=$('lE').value.trim().toLowerCase(), pw=$('lP').value;
    if(loginMode==='daftar'){
      if(USERS[email]){loginMsg='Email ini sudah terdaftar. Silakan masuk.';loginMode='masuk';render();return;}
      USERS[email]={nama:$('lN').value.trim()||email.split('@')[0],pass:hash(pw),data:emptyData()};
    }else{
      if(!USERS[email]){$('lErr').textContent='Akun belum terdaftar. Klik Daftar untuk membuat akun.';return;}
      if(USERS[email].pass!==hash(pw)){$('lErr').textContent='Password salah. Coba lagi.';return;}
    }
    SESSION=email;S=USERS[email].data;loginMsg='';put(UKEY,USERS);put(SKEY,SESSION);location.hash='#beranda';render();};
  if($('toDaftar')) $('toDaftar').onclick=()=>{loginMode='daftar';loginMsg='';render();};
  if($('toMasuk')) $('toMasuk').onclick=()=>{loginMode='masuk';loginMsg='';render();};
  if($('logout')) $('logout').onclick=()=>{save();SESSION=null;S=null;put(SKEY,null);loginMode='masuk';render();};
  if($('fTask')) $('fTask').onsubmit=e=>{e.preventDefault();
    const t={id:editTask||newId(),nama:$('tN').value.trim(),mk:$('tM').value.trim(),sks:+$('tS').value,deadline:$('tD').value,bobot:+$('tB').value,kes:+$('tK').value,durasi:+$('tJ').value,done:false};
    if(!t.nama||!t.mk){$('tErr').textContent='Isi nama tugas dan mata kuliah.';return;}
    const old=editTask?taskById(editTask):null;
    if(!t.deadline||(parseISO(t.deadline)<today0()&&!(old&&old.deadline===t.deadline))){$('tErr').textContent='Deadline tidak boleh sebelum hari ini.';return;}
    if(!(t.durasi>0)){$('tErr').textContent='Durasi harus lebih dari 0 jam.';return;}
    if(old){t.done=old.done;t.doneAt=old.doneAt;S.tasks[S.tasks.indexOf(old)]=t;}else S.tasks.push(t);
    editTask=null;askDel=false;save();render();};
  document.querySelectorAll('[data-done]').forEach(el=>el.onchange=()=>{const t=taskById(+el.dataset.done);t.done=el.checked;t.doneAt=el.checked?iso(today0()):undefined;save();render();});
  const toForm=()=>{const c=$('formCard');if(c)c.scrollIntoView({block:'start'});};
  document.querySelectorAll('[data-edittask]').forEach(el=>el.onclick=()=>{editTask=+el.dataset.edittask;askDel=false;render();toForm();});
  document.querySelectorAll('[data-editfix]').forEach(el=>el.onclick=()=>{editFix=+el.dataset.editfix;askDel=false;render();toForm();});
  if($('cancelEdit')) $('cancelEdit').onclick=()=>{editTask=null;editFix=null;askDel=false;render();};
  if($('askDel')) $('askDel').onclick=()=>{askDel=true;render();toForm();};
  if($('delNo')) $('delNo').onclick=()=>{askDel=false;render();toForm();};
  if($('delYes')) $('delYes').onclick=()=>{if(editTask)S.tasks=S.tasks.filter(t=>t.id!==editTask);if(editFix)S.fixed=S.fixed.filter(f=>f.id!==editFix);editTask=null;editFix=null;askDel=false;save();render();};
  if($('fFix')) $('fFix').onsubmit=e=>{e.preventDefault();
    const f={id:editFix||newId(),nama:$('fxN').value.trim(),hari:+$('fxH').value,mulai:$('fxA').value,selesai:$('fxB').value};
    if(toU(f.selesai)<=toU(f.mulai)){$('fxErr').textContent='Jam selesai harus setelah jam mulai.';return;}
    const clash=S.fixed.find(x=>x.id!==f.id&&x.hari===f.hari&&toU(f.mulai)<toU(x.selesai)&&toU(x.mulai)<toU(f.selesai));
    if(clash){$('fxErr').textContent=`Bentrok dengan "${clash.nama}" (${clash.mulai.replace(':','.')}–${clash.selesai.replace(':','.')}). Pilih jam lain.`;return;}
    const oi=S.fixed.findIndex(x=>x.id===f.id);if(oi>=0)S.fixed[oi]=f;else S.fixed.push(f);
    editFix=null;askDel=false;save();render();};
  if($('fSet')) $('fSet').onsubmit=e=>{e.preventDefault();S.settings.jamMaks=+$('sJ').value||4;S.settings.mulai=$('sA').value||'08:00';S.settings.selesai=$('sB').value||'21:00';S.settings.w=[0,1,2,3,4].map(j=>Math.max(0,+$('w'+j).value||0));save();render();};
  if($('reset')) $('reset').onclick=()=>{S=sample();save();location.hash='#beranda';render();};
  if($('clear')) $('clear').onclick=()=>{S=emptyData();save();location.hash='#beranda';render();};
  if($('copyIcs')) $('copyIcs').onclick=()=>copy('ics','icsMsg');
  if($('copyRep')) $('copyRep').onclick=()=>copy('rep','repMsg');
}
window.addEventListener('hashchange',()=>{editTask=null;editFix=null;askDel=false;render();});
render();
</script>
</body>
</html>
